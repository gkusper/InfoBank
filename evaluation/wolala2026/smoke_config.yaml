  - case_id: S8_UNAMBIGUOUS_LATER_CANCELLATION
    description: Later contrastive evidence closes the action and does not force CFAF.
    query: Is the wetlands budget packet still open?
    task: action_status
    purpose: personal_planning
    requested_content: action_status
    requested_granularity: individual
    requested_action: answer
    time_horizon: current
    required_evidence_strength: primary
    source_scope: permitted_personal_sources
    expected_permitted_output: CONTENT
    expected_top_level_mode: FULL
    expected_cfaf_realization:
    expected_public_reason_class:
    expected_internal_reason_class:
    gold_answer: The wetlands budget packet request is closed or cancelled.
    protected_markers: []
    sources:
      - source_id: s8-primary
        source_type: Email
        title: Wetlands budget request
        content: Please prepare the wetlands budget packet.
        metadata:
          timestamp: 2026-01-01T09:00:00
        access_mode: FULL
        existence_visibility: PUBLIC
        policy_rule_id: WOLALA-POL-FULL
        evidential_role: PRIMARY
        evidence_state: CURRENT
        relation: SUPPORTS
      - source_id: s8-cancel
        source_type: Email
        title: Wetlands budget cancellation
        content: The wetlands budget packet request is no longer needed.
        metadata:
          timestamp: 2026-01-02T09:00:00
        access_mode: FULL
        existence_visibility: PUBLIC
        policy_rule_id: WOLALA-POL-FULL
        evidential_role: CONTRASTIVE
        evidence_state: CURRENT
        relation: CLOSES

