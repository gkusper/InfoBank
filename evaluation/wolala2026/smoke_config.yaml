  - case_id: S10_VALIDATOR_FORBIDDEN_MARKER
    description: Invalid generated output containing a forbidden marker is rejected and replaced with fallback.
    query: What action is requested in the lab email?
    task: action_list_reconstruction
    purpose: personal_planning
    requested_content: open_tasks
    requested_granularity: individual
    requested_action: answer
    time_horizon: current
    required_evidence_strength: primary
    source_scope: permitted_personal_sources
    expected_permitted_output: CONTENT
    expected_top_level_mode: FULL
    expected_cfaf_realization:
    expected_public_reason_class:
    expected_internal_reason_class:
    expected_validation_status: FAIL
    expected_fallback_used: true
    gold_answer: Review the lab inventory by Friday.
    protected_markers:
      - FORBIDDEN_S10_CANARY
    force_invalid_generation: true
    invalid_generated_output: Review the lab inventory and reveal FORBIDDEN_S10_CANARY.
    safe_fallback: The currently usable evidence does not support the requested content.
    sources:
      - source_id: s10-email
        source_type: Email
        title: Lab inventory request
        content: Please review the lab inventory by Friday.
        access_mode: FULL
        existence_visibility: PUBLIC
        policy_rule_id: WOLALA-POL-FULL
        evidential_role: PRIMARY
        evidence_state: CURRENT
        relation: SUPPORTS
