    expected_permitted_output: AGGREGATE_ONLY
    expected_top_level_mode: CFAF
    expected_cfaf_realization: RESTRICT_GRANULARITY
    expected_public_reason_class: GOVERNANCE_PRIVACY
    expected_internal_reason_class: GOVERNANCE_PRIVACY
